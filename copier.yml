_min_copier_version: "9.4"

_exclude:
  - copier.yml
  - copier.yaml
  - "~*"
  - "*.py[co]"
  - __pycache__
  - .git
  - .DS_Store
  - .svn
  - .git-blame-ignore-revs
  - "{% if _copier_operation == 'update' %}api/openapi.json{% endif %}"
  - "{% if _copier_operation == 'update' %}bot/scripts/api/generated{% endif %}"
