[project]
name = "api"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi[standard]==0.121.0",
  "fastapi-utils==0.8.0",
  "pydantic-settings==2.11.0",
  "typing-inspect==0.9.0",
  "sqlalchemy==2.0.44",
  "alembic==1.17.1",
  "python-dotenv",
]

[tool.uv]
# This is an app, not an installable library
package = false

[tool.fastapi]
entrypoint = "main:app"
